<footer
    role="status"
    aria-live="polite"
    class="flex h-8 shrink-0 items-center justify-between gap-4 border-t border-[color:var(--c-gold)] bg-[color:var(--c-iron)] px-3 text-xs tracking-wide text-[color:var(--c-parchment-dim)]"
>
    <span class="truncate" data-testid="status-text">{{ text() }}</span>

    <ul class="m-0 flex shrink-0 list-none items-center gap-4 p-0">
        @for (indicator of indicators(); track indicator.id) {
            <li
                class="flex items-center gap-1.5"
                [attr.data-state]="indicator.state"
                [attr.title]="indicator.tooltip || null"
            >
                <span
                    aria-hidden="true"
                    [attr.data-testid]="'marker-' + indicator.state"
                    class="inline-block h-2.5 w-2.5 rotate-45 border"
                    [style.background-color]="indicator.state === 'ok' ? 'var(--c-ok)' : 'var(--c-blood-bright)'"
                    [style.border-color]="indicator.state === 'ok' ? 'var(--c-parchment)' : 'var(--c-gold-bright)'"
                ></span>
                <span>{{ indicator.label }}</span>
                <span class="sr-only">{{
                    indicator.state === 'ok' ? 'OK' : 'Error'
                }}</span>
            </li>
        }
    </ul>
</footer>
