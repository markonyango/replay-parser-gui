<footer
    role="status"
    aria-live="polite"
    class="flex h-7 shrink-0 items-center justify-between gap-4 border-t border-gray-300 bg-gray-100 px-3 text-xs text-gray-700"
>
    <span class="truncate" data-testid="status-text">{{ text() }}</span>

    <ul class="m-0 flex shrink-0 list-none items-center gap-4 p-0">
        @for (indicator of indicators(); track indicator.id) {
            <li
                class="flex items-center gap-1.5"
                [attr.data-state]="indicator.state"
                [attr.title]="indicator.tooltip || null"
            >
                <span
                    aria-hidden="true"
                    class="inline-block h-2.5 w-2.5 rounded-full"
                    [class.bg-green-600]="indicator.state === 'ok'"
                    [class.bg-red-600]="indicator.state === 'error'"
                ></span>
                <span>{{ indicator.label }}</span>
                <span class="sr-only">{{
                    indicator.state === 'ok' ? 'OK' : 'Error'
                }}</span>
            </li>
        }
    </ul>
</footer>
