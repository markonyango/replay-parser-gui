<div class="flex flex-nowrap gap-3">
  <span class="flex">{{ teamOne() }}</span>
  @if (winner() !== null) {
    <span class="flex" data-result>{{ winner() === 0 ? '&#127942;' : '&#9760;' }}</span>
  }
  <span class="flex">vs.</span>
  @if (winner() !== null) {
    <span class="flex" data-result>{{ winner() === 1 ? '&#127942;' : '&#9760;' }}</span>
  }
  <span class="flex">{{ teamTwo() }}</span>
</div>
