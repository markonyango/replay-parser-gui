name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Creates the draft release both platform builds upload into.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_id: ${{ steps.release.outputs.id }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: echo "version=$(jq -r '.version' src-tauri/tauri.conf.json)" >> $GITHUB_OUTPUT

      - name: Generate release notes
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            git log "$LAST_TAG"..HEAD --oneline --no-merges > notes.txt
          else
            git log --oneline --no-merges -20 > notes.txt
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: notes.txt

      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        # Take the id from the create response: a fresh draft is not listed right away.
        run: |
          ID=$(gh api "repos/${{ github.repository }}/releases" \
            -f tag_name="v${VERSION}" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="ESLReporter v${VERSION}" \
            -F body=@notes.txt \
            -F draft=true \
            --jq '.id')
          if [ -z "$ID" ]; then
            echo "::error::Could not read the id of the created release"
            exit 1
          fi
          echo "id=${ID}" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          # Oldest supported runner, so the AppImage links against an older glibc
          # and still runs on older distros.
          - platform: ubuntu-22.04
            args: '--bundles appimage'
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libgtk-3-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Build and upload bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          # The updater reads the Gist manifest written below, not latest.json.
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  # Publishes the release and points the updater Gist at it, once both builds succeeded.
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Download updater signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          gh release download "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --pattern '*.sig' \
            --dir sigs

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: gh release edit "v${VERSION}" --repo "${{ github.repository }}" --draft=false

      - name: Update updater Gist
        env:
          GIST_PAT: ${{ secrets.GIST_PAT }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          REPO="${{ github.repository }}"
          BASE_URL="https://github.com/${REPO}/releases/download/v${VERSION}"

          MSI_FILE="ESLReporter_${VERSION}_x64_en-US.msi.zip"
          APPIMAGE_FILE="ESLReporter_${VERSION}_amd64.AppImage.tar.gz"
          MSI_SIG=$(cat "sigs/${MSI_FILE}.sig")
          APPIMAGE_SIG=$(cat "sigs/${APPIMAGE_FILE}.sig")

          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          MANIFEST=$(jq -n \
            --arg version "$VERSION" \
            --rawfile notes notes.txt \
            --arg pub_date "$PUB_DATE" \
            --arg msi_url "${BASE_URL}/${MSI_FILE}" \
            --arg msi_sig "$MSI_SIG" \
            --arg appimage_url "${BASE_URL}/${APPIMAGE_FILE}" \
            --arg appimage_sig "$APPIMAGE_SIG" \
            '{
              version: $version,
              notes: ($notes | rtrimstr("\n")),
              pub_date: $pub_date,
              platforms: {
                "windows-x86_64": {
                  url: $msi_url,
                  signature: $msi_sig
                },
                "linux-x86_64": {
                  url: $appimage_url,
                  signature: $appimage_sig
                }
              }
            }')

          GIST_ID="02ca7c931510bbd2a225a3588bb6e9c1"
          curl -sS --fail-with-body -X PATCH \
            -H "Authorization: token ${GIST_PAT}" \
            -H "Content-Type: application/json" \
            -d "{\"files\":{\"esl-reporter-update.json\":{\"content\":$(echo "$MANIFEST" | jq -Rs .)}}}" \
            "https://api.github.com/gists/${GIST_ID}"
